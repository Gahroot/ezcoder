name: Release

# Build + sign + publish the ezcoder-app desktop bundle for every OS/arch on a tag
# push (v*). Each runner stages its own per-platform Node runtime and bundles
# the sidecar (so sharp's native binary matches the target), then tauri-action
# produces the installers, signs the updater artifacts, uploads them to a
# published (non-draft) GitHub release, and generates `latest.json` for the
# updater endpoint.
#
# Required repository secrets:
#   Updater signing (all OSes):
#     TAURI_SIGNING_PRIVATE_KEY           — minisign private key (must match the
#                                           `plugins.updater.pubkey` in tauri.conf.json)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — password for that key
#   macOS code signing + notarization (only used on the macOS matrix legs):
#     APPLE_CERTIFICATE           — base64 of the exported "Developer ID Application" .p12
#     APPLE_CERTIFICATE_PASSWORD  — password set when exporting that .p12
#     APPLE_SIGNING_IDENTITY      — e.g. "Developer ID Application: NAME (396M7LY29W)"
#     KEYCHAIN_PASSWORD           — any throwaway password for the CI keychain
#     APPLE_ID                    — Apple ID email used for notarization
#     APPLE_PASSWORD              — app-specific password for that Apple ID
#     APPLE_TEAM_ID               — Apple Team ID (396M7LY29W)
# Signing/notarization is skipped automatically if the Apple secrets are absent
# (the updater artifacts remain signed). Windows code signing is a follow-up.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Create (or find) the GitHub release once, before any build, with retries.
  # tauri-action creating it per leg also PATCHes an existing release's name and
  # body, and one GitHub HTTP 500 on that call can fail a fully built, notarized
  # macOS leg. With `releaseId` the legs only upload, and uploads retry.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on origin/main" >&2
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Create or find the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # Notes come from the in-app "What's new" entry for this version.
          body=$(node .github/ci/release-notes.mjs "$TAG") ||
            body="Download the installer for your platform from the assets below."
          id=""
          for attempt in 1 2 3 4 5 6; do
            # GET first: a create that 500s may still have made the release.
            id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null) && break
            id=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="ezcoder $TAG" \
              -f body="$body" \
              -F draft=false -F prerelease=false --jq .id) && break
            id=""
            echo "Release lookup/create failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 10))
          done
          [[ -n "$id" ]] || {
            echo "Could not create or find the release for $TAG" >&2
            exit 1
          }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64). macos-14 was retired by GitHub (jobs fail with
          # "configuration not supported"); CI already builds on macos-latest.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # NOTE: Intel macOS (x86_64) is intentionally omitted. GitHub's free
          # Intel mac runners are effectively unavailable (jobs queue for hours),
          # and a universal binary isn't viable here because the bundled Node
          # runtime + native .node addons are single-arch. Re-add a
          # `macos-13 / --target x86_64-apple-darwin` leg if a paid/Intel runner
          # becomes available. Apple Silicon covers all Macs sold since 2020.
          - platform: windows-latest
            args: ""
          # Linux x86_64: deb + rpm only — AppImage's linuxdeploy hangs on CI
          # for Node-bundling apps. Built on the OLDEST supported Ubuntu
          # because the binary links the runner's glibc: a 24.04 build would
          # refuse to start on 22.04/Debian 12. The updater installs deb/rpm
          # updates in place (pkexec prompt) via `linux-x86_64-{deb,rpm}` keys.
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
    runs-on: ${{ matrix.platform }}
    # Signing + notarization + per-OS installer builds take ~15-20 min on
    # macOS/Windows. The Linux leg spends ~50 min in tauri's RPM bundler alone,
    # so 60 min cancelled it before upload.
    timeout-minutes: 100
    # A boolean flag, not the certificate itself, so an absent certificate stays
    # genuinely unset for Tauri and the established ad-hoc macOS build still works.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release context
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on origin/main" >&2
            exit 1
          }
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing updater signing secret: $name" >&2
              exit 1
            }
          done

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      # Same cache as the ci.yml app job: the Tauri dependency tree is large
      # and identical across runs; without this every tag rebuilds it from
      # scratch on both matrix legs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ezcoder-app/src-tauri

      - name: Linux system deps (tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      # shell: bash is load-bearing on the windows-latest leg. The default shell
      # there is PowerShell, which does NOT abort a multi-line script when an
      # intermediate command exits non-zero — only the LAST line decides the
      # step's outcome. Without this a failing @prestyj/ai or @prestyj/agent build is
      # silently swallowed by ezcoder's build succeeding after it, and we SHIP
      # an installer built from stale or missing artifacts. The same bug hid 72
      # failing tests in ci.yml.
      - name: Build framework packages
        shell: bash
        run: |
          pnpm --filter @prestyj/ai build
          pnpm --filter @prestyj/agent build
          pnpm --filter @prestyj/core build
          pnpm --filter @prestyj/pixel build
          pnpm --filter @prestyj/cli build

      - name: Stage node runtime + bundle sidecar
        run: |
          pnpm --filter ezcoder-app stage:node
          pnpm --filter ezcoder-app bundle:sidecar
        shell: bash

      - name: Sidecar smoke (bundled runtime + bundle)
        run: node ezcoder-app/scripts/smoke-sidecar.mjs
        shell: bash

      # Import the Developer ID certificate only when configured. Public updater
      # artifacts remain signed by the required Tauri updater key either way.
      - name: Import Apple Developer certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      # Sign the nested Mach-O binaries Tauri won't touch (the staged Node
      # runtime + the sidecar's native addons under bundle.resources) with
      # Developer ID + hardened runtime + secure timestamp, so notarization of
      # the assembled app passes. Runs after the cert is in the keychain and
      # before tauri-action assembles + notarizes the bundle.
      - name: Sign nested bundle binaries (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        run: |
          bash ezcoder-app/scripts/sign-nested-macos.sh \
            "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            ezcoder-app/src-tauri/binaries \
            ezcoder-app/src-tauri/sidecar

      # Keep macOS signing variables genuinely unset for the ad-hoc path. Tauri
      # treats present-but-empty Apple variables as a request to notarize.
      - name: Configure macOS signing env
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # v1 generates versioned updater artifacts and latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ezcoder-app
          # Upload-only into the release created above (no create/update calls).
          releaseId: ${{ needs.create-release.outputs.id }}
          # Retries a failed asset or latest.json upload (GitHub 5xx).
          retryAttempts: 3
          # Generates + uploads `latest.json` for the updater endpoint
          # (default true; kept explicit because the updater depends on it).
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
